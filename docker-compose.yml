services:
  db:
    image: postgres:15-alpine
    container_name: bridgedesk_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: bridgedesk
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bridgedesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: bridgedesk_backend
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=yourpassword
      - DB_NAME=bridgedesk
      - PORT=8080
      - SMTP_FROM=docestatesolutions@gmail.com
      - SMTP_PASSWORD=wmygqyafvstcejig
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: bridgedesk_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
